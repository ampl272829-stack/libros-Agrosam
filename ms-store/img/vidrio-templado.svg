<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f4f8"/><stop offset="100%" stop-color="#f8f9fc"/></linearGradient></defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="60" y="30" width="280" height="340" rx="40" fill="rgba(200,230,240,0.3)" stroke="rgba(150,200,220,0.3)" stroke-width="1" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.06))"/>
  <!-- Glass reflection -->
  <rect x="60" y="30" width="280" height="340" rx="40" fill="url(#glass)"/>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Glare -->
  <rect x="80" y="50" width="100" height="300" rx="30" fill="rgba(255,255,255,0.1)"/>
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="28" fill="rgba(100,150,180,0.3)" font-weight="800">9H</text>
  <text x="200" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a8aaa" font-weight="600">Dureza 9H · Anti-huellas</text>
</svg>
