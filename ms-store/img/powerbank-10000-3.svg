<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><g transform="rotate(4 200 200)">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0faf0"/><stop offset="100%" stop-color="#d0ead0"/></linearGradient></defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="110" y="30" width="180" height="340" rx="24" fill="#fff" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.08))" stroke="#e8e8f0" stroke-width="1"/>
  <!-- Battery level indicator -->
  <rect x="175" y="20" width="50" height="18" rx="6" fill="#e8e8f0"/>
  <rect x="178" y="23" width="30" height="12" rx="4" fill="#34c759"/>
  <rect x="225" y="25" width="10" height="8" rx="2" fill="#d0d0d8"/>
  <!-- Body detail -->
  <rect x="130" y="60" width="140" height="250" rx="12" fill="#f5f5fa"/>
  <!-- Ports -->
  <rect x="145" y="290" width="40" height="14" rx="4" fill="#1a1a2e"/>
  <rect x="195" y="290" width="40" height="14" rx="4" fill="#6c63ff"/>
  <!-- Power button -->
  <rect x="185" y="270" width="30" height="10" rx="5" fill="#e8e8f0"/>
  <!-- Battery icon -->
  <rect x="175" y="100" width="50" height="140" rx="12" fill="#e8e8f0"/>
  <rect x="180" y="105" width="40" height="100" rx="8" fill="#34c759"/>
  <rect x="180" y="210" width="40" height="25" rx="8" fill="#e8e8f0"/>
  <text x="200" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff" font-weight="700">10000</text>
  <text x="200" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a8aaa" font-weight="600">10000mAh · PD 20W</text>
</g></svg>
